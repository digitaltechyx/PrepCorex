<!-- Prep Services FBA / PrepCorex — warehouse proximity map
     Paste into WordPress: Custom HTML block (or Elementor HTML).
     Requires internet (Leaflet + Esri tiles + Google Fonts CDNs). -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
  crossorigin=""
/>
<script
  src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
  crossorigin=""
></script>

<style>
  .psf-map-wrap {
    --psf-navy: #071a3d;
    --psf-bg: #050e1f;
    --psf-panel: #0c1a33;
    --psf-border: rgba(148, 163, 184, 0.22);
    --psf-text: #f8fafc;
    --psf-muted: #94a3b8;
    --psf-accent: #38bdf8;
    --psf-amazon: #f97316;
    --psf-walmart: #38bdf8;
    --psf-tiktok: #fb7185;
    font-family: "Outfit", system-ui, sans-serif;
    color: var(--psf-text);
    background: linear-gradient(180deg, #050e1f 0%, #071a3d 100%);
    border: 1px solid rgba(56, 189, 248, 0.18);
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 20px 50px rgba(2, 6, 23, 0.55), 0 0 0 1px rgba(7, 26, 61, 0.8);
    max-width: 1100px;
    margin: 0 auto;
  }

  .psf-map-stage {
    position: relative;
    height: min(52vw, 420px);
    min-height: 280px;
    background: #020617;
  }

  #psf-leaflet-map {
    width: 100%;
    height: 100%;
    background: #020617;
  }

  .psf-hub-chip {
    position: absolute;
    z-index: 500;
    left: 50%;
    top: 14px;
    transform: translateX(-50%);
    background: rgba(7, 26, 61, 0.94);
    border: 1px solid rgba(56, 189, 248, 0.35);
    border-radius: 12px;
    padding: 10px 16px;
    text-align: center;
    backdrop-filter: blur(8px);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    max-width: calc(100% - 24px);
  }

  .psf-hub-chip .psf-brand {
    display: block;
    font-size: 0.7rem;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--psf-accent);
    margin-bottom: 2px;
  }

  .psf-hub-chip strong {
    display: block;
    font-size: 0.95rem;
    letter-spacing: 0.02em;
    font-weight: 700;
  }

  .psf-hub-chip span {
    display: block;
    margin-top: 2px;
    font-size: 0.78rem;
    color: var(--psf-muted);
  }

  .psf-cards {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 12px;
    padding: 14px;
    background: var(--psf-bg);
  }

  .psf-card {
    background: var(--psf-panel);
    border: 1px solid var(--psf-border);
    border-radius: 14px;
    padding: 14px;
    cursor: pointer;
    transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
    text-align: left;
  }

  .psf-card:hover,
  .psf-card.is-active {
    transform: translateY(-2px);
  }

  .psf-card[data-accent="amazon"] {
    box-shadow: inset 0 0 0 1px rgba(249, 115, 22, 0.35);
  }
  .psf-card[data-accent="amazon"]:hover,
  .psf-card[data-accent="amazon"].is-active {
    border-color: rgba(249, 115, 22, 0.7);
    box-shadow: 0 0 0 1px rgba(249, 115, 22, 0.45), 0 12px 28px rgba(249, 115, 22, 0.12);
  }

  .psf-card[data-accent="walmart"] {
    box-shadow: inset 0 0 0 1px rgba(56, 189, 248, 0.35);
  }
  .psf-card[data-accent="walmart"]:hover,
  .psf-card[data-accent="walmart"].is-active {
    border-color: rgba(56, 189, 248, 0.7);
    box-shadow: 0 0 0 1px rgba(56, 189, 248, 0.45), 0 12px 28px rgba(56, 189, 248, 0.12);
  }

  .psf-card[data-accent="tiktok"] {
    box-shadow: inset 0 0 0 1px rgba(251, 113, 133, 0.35);
  }
  .psf-card[data-accent="tiktok"]:hover,
  .psf-card[data-accent="tiktok"].is-active {
    border-color: rgba(251, 113, 133, 0.7);
    box-shadow: 0 0 0 1px rgba(251, 113, 133, 0.45), 0 12px 28px rgba(251, 113, 133, 0.12);
  }

  .psf-card-top {
    display: flex;
    gap: 10px;
    align-items: flex-start;
  }

  .psf-logo {
    width: 36px;
    height: 36px;
    border-radius: 8px;
    background: #fff;
    color: #0f172a;
    display: grid;
    place-items: center;
    font-size: 0.68rem;
    font-weight: 700;
    flex-shrink: 0;
    letter-spacing: -0.02em;
  }

  .psf-card h3 {
    margin: 0;
    font-size: 0.92rem;
    font-weight: 600;
    line-height: 1.25;
  }

  .psf-card .psf-addr {
    margin: 4px 0 0;
    font-size: 0.75rem;
    color: var(--psf-muted);
    line-height: 1.35;
  }

  .psf-metrics {
    margin-top: 12px;
    font-size: 0.9rem;
    font-weight: 600;
  }

  .psf-card[data-accent="amazon"] .psf-metrics,
  .psf-card[data-accent="amazon"] .psf-expand {
    color: var(--psf-amazon);
  }
  .psf-card[data-accent="walmart"] .psf-metrics,
  .psf-card[data-accent="walmart"] .psf-expand {
    color: var(--psf-walmart);
  }
  .psf-card[data-accent="tiktok"] .psf-metrics,
  .psf-card[data-accent="tiktok"] .psf-expand {
    color: var(--psf-tiktok);
  }

  .psf-expand {
    margin-top: 10px;
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  .psf-extra {
    display: none;
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid rgba(148, 163, 184, 0.2);
    font-size: 0.78rem;
    color: var(--psf-muted);
    line-height: 1.45;
  }

  .psf-card.is-open .psf-extra {
    display: block;
  }

  .psf-card.is-open .psf-expand::before {
    content: "− ";
  }

  .psf-card:not(.is-open) .psf-expand::before {
    content: "+ ";
  }

  /* Blinking / pulse pointers */
  .psf-pin-wrap {
    position: relative;
    width: 22px;
    height: 22px;
  }

  .psf-pin-wrap::before,
  .psf-pin-wrap::after {
    content: "";
    position: absolute;
    left: 50%;
    top: 50%;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    background: currentColor;
    opacity: 0.55;
    animation: psf-pin-blink 1.6s ease-out infinite;
  }

  .psf-pin-wrap::after {
    animation-delay: 0.8s;
  }

  .psf-pin {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 14px;
    height: 14px;
    margin: -7px 0 0 -7px;
    border-radius: 50%;
    border: 2px solid #fff;
    background: currentColor;
    box-shadow: 0 0 10px currentColor;
    z-index: 2;
    animation: psf-pin-dot 1.6s ease-in-out infinite;
  }

  .psf-pin-hub-wrap {
    position: relative;
    width: 26px;
    height: 26px;
    color: #38bdf8;
  }

  .psf-pin-hub-wrap::before,
  .psf-pin-hub-wrap::after {
    content: "";
    position: absolute;
    left: 50%;
    top: 50%;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    border: 2px solid currentColor;
    opacity: 0.7;
    animation: psf-hub-ring 1.8s ease-out infinite;
  }

  .psf-pin-hub-wrap::after {
    animation-delay: 0.9s;
  }

  .psf-pin-hub {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 16px;
    height: 16px;
    margin: -8px 0 0 -8px;
    border-radius: 50%;
    background: #38bdf8;
    border: 3px solid #fff;
    box-shadow: 0 0 12px rgba(56, 189, 248, 0.9);
    z-index: 2;
    animation: psf-pin-dot 1.6s ease-in-out infinite;
  }

  @keyframes psf-pin-blink {
    0% {
      transform: translate(-50%, -50%) scale(1);
      opacity: 0.55;
    }
    70% {
      transform: translate(-50%, -50%) scale(2.6);
      opacity: 0;
    }
    100% {
      transform: translate(-50%, -50%) scale(2.6);
      opacity: 0;
    }
  }

  @keyframes psf-hub-ring {
    0% {
      transform: translate(-50%, -50%) scale(1);
      opacity: 0.75;
    }
    75% {
      transform: translate(-50%, -50%) scale(2.8);
      opacity: 0;
    }
    100% {
      transform: translate(-50%, -50%) scale(2.8);
      opacity: 0;
    }
  }

  @keyframes psf-pin-dot {
    0%,
    100% {
      opacity: 1;
      filter: brightness(1);
    }
    50% {
      opacity: 0.55;
      filter: brightness(1.35);
    }
  }

  .leaflet-control-attribution {
    background: rgba(2, 6, 23, 0.75) !important;
    color: #94a3b8 !important;
    font-size: 10px !important;
  }

  .leaflet-control-attribution a {
    color: #cbd5e1 !important;
  }

  .leaflet-bar a {
    background: #071a3d !important;
    color: #f8fafc !important;
    border-bottom-color: rgba(148, 163, 184, 0.25) !important;
  }

  @media (max-width: 820px) {
    .psf-cards {
      grid-template-columns: 1fr;
    }
    .psf-map-stage {
      height: 300px;
    }
  }
</style>

<div class="psf-map-wrap" id="psf-map-root">
  <div class="psf-map-stage">
    <div class="psf-hub-chip">
      <span class="psf-brand">PrepCorex · Prep Services FBA</span>
      <strong>Prep Services FBA Warehouse</strong>
      <span>7000 Atrium Way, Unit B05, Mount Laurel, NJ 08054</span>
    </div>
    <div
      id="psf-leaflet-map"
      aria-label="Map of Prep Services FBA warehouse near major fulfillment centers"
    ></div>
  </div>

  <div class="psf-cards" role="list">
    <button
      type="button"
      class="psf-card"
      data-accent="amazon"
      data-target="amazon"
      role="listitem"
      aria-expanded="false"
    >
      <div class="psf-card-top">
        <div class="psf-logo" aria-hidden="true">a</div>
        <div>
          <h3>Amazon Fulfillment Center</h3>
          <p class="psf-addr">2439 Center Square Rd, Logan Township, NJ</p>
        </div>
      </div>
      <div class="psf-metrics">~35 min · ~28 miles</div>
      <div class="psf-expand">Click to expand</div>
      <div class="psf-extra">
        Fast Amazon FBA lane from our Mount Laurel warehouse — prep, labeling, and FC-ready outbound
        through PrepCorex.
      </div>
    </button>

    <button
      type="button"
      class="psf-card"
      data-accent="walmart"
      data-target="walmart"
      role="listitem"
      aria-expanded="false"
    >
      <div class="psf-card-top">
        <div class="psf-logo" aria-hidden="true">W+</div>
        <div>
          <h3>Walmart Fulfillment Center</h3>
          <p class="psf-addr">2401 East State St Ext, Hamilton Township, NJ</p>
        </div>
      </div>
      <div class="psf-metrics">~40 min · ~32 miles</div>
      <div class="psf-expand">Click to expand</div>
      <div class="psf-extra">
        Strong WFS coverage from Prep Services FBA. Cartonization, labeling, and appointment-ready
        outbound managed in PrepCorex.
      </div>
    </button>

    <button
      type="button"
      class="psf-card"
      data-accent="tiktok"
      data-target="tiktok"
      role="listitem"
      aria-expanded="false"
    >
      <div class="psf-card-top">
        <div class="psf-logo" aria-hidden="true">♪</div>
        <div>
          <h3>FBT Fulfillment by TikTok</h3>
          <p class="psf-addr">245 Mountain Ave, Middlesex, NJ 08846</p>
        </div>
      </div>
      <div class="psf-metrics">~50 min · ~42 miles</div>
      <div class="psf-expand">Click to expand</div>
      <div class="psf-extra">
        TikTok Shop FBT within range of our NJ warehouse — keep social commerce inventory close for
        faster restocks and returns.
      </div>
    </button>
  </div>
</div>

<script>
(function () {
  function boot() {
    if (!window.L) {
      console.error("Leaflet failed to load");
      return;
    }

    var hub = {
      id: "hub",
      name: "Prep Services FBA",
      address: "7000 Atrium Way, Unit B05, Mount Laurel, NJ 08054",
      lat: 39.9339,
      lng: -74.9209,
      color: "#38bdf8",
    };

    var destinations = {
      amazon: {
        id: "amazon",
        name: "Amazon Fulfillment Center",
        lat: 39.7915,
        lng: -75.3555,
        color: "#f97316",
      },
      walmart: {
        id: "walmart",
        name: "Walmart Fulfillment Center",
        lat: 40.2275,
        lng: -74.6688,
        color: "#38bdf8",
      },
      tiktok: {
        id: "tiktok",
        name: "FBT Fulfillment by TikTok",
        lat: 40.5728,
        lng: -74.5018,
        color: "#fb7185",
      },
    };

    var mapEl = document.getElementById("psf-leaflet-map");
    if (!mapEl || mapEl._psfBooted) return;
    mapEl._psfBooted = true;

    var map = L.map("psf-leaflet-map", {
      zoomControl: false,
      scrollWheelZoom: false,
      attributionControl: true,
    }).setView([40.12, -74.9], 8);

    L.control.zoom({ position: "bottomright" }).addTo(map);

    L.tileLayer(
      "https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}",
      {
        attribution: "Leaflet | Tiles © Esri",
        maxZoom: 16,
      }
    ).addTo(map);

    function pinIcon(color, isHub) {
      if (isHub) {
        return L.divIcon({
          className: "",
          html:
            '<div class="psf-pin-hub-wrap"><span class="psf-pin-hub"></span></div>',
          iconSize: [26, 26],
          iconAnchor: [13, 13],
        });
      }
      return L.divIcon({
        className: "",
        html:
          '<div class="psf-pin-wrap" style="color:' +
          color +
          '"><span class="psf-pin" style="background:' +
          color +
          '"></span></div>',
        iconSize: [22, 22],
        iconAnchor: [11, 11],
      });
    }

    var markers = {};

    L.marker([hub.lat, hub.lng], { icon: pinIcon(hub.color, true) })
      .addTo(map)
      .bindPopup(
        "<strong>" +
          hub.name +
          "</strong><br/>PrepCorex warehouse<br/>" +
          hub.address
      );

    Object.keys(destinations).forEach(function (key) {
      var d = destinations[key];
      markers[key] = L.marker([d.lat, d.lng], { icon: pinIcon(d.color, false) })
        .addTo(map)
        .bindPopup("<strong>" + d.name + "</strong>");

      L.polyline(
        [
          [hub.lat, hub.lng],
          [d.lat, d.lng],
        ],
        {
          color: d.color,
          weight: 2.5,
          opacity: 0.9,
          dashArray: "8 8",
        }
      ).addTo(map);
    });

    document.querySelectorAll(".psf-card").forEach(function (card) {
      card.addEventListener("click", function () {
        var key = card.getAttribute("data-target");
        var alreadyOpen = card.classList.contains("is-open");
        document.querySelectorAll(".psf-card").forEach(function (c) {
          c.classList.remove("is-open", "is-active");
          c.setAttribute("aria-expanded", "false");
        });
        card.classList.add("is-active");
        if (!alreadyOpen) {
          card.classList.add("is-open");
          card.setAttribute("aria-expanded", "true");
        }
        var d = destinations[key];
        if (d) {
          map.flyTo([d.lat, d.lng], 10, { duration: 0.8 });
          markers[key].openPopup();
        }
      });
    });

    setTimeout(function () {
      map.invalidateSize();
    }, 200);
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", boot);
  } else {
    boot();
  }
})();
</script>
