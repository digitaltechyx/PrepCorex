<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Popup F · Lottie Wave Character</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/@lottiefiles/lottie-player@2.0.12/dist/lottie-player.js"></script>
  <style>
    :root {
      --orange: #ff8806; --orange-deep: #e07805; --ink: #14110e;
      --muted: #5c564e; --cream: #f7f4ef; --soft: #fff8f0; --line: rgba(20,17,14,.1);
      --font: "Outfit", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; font-family: var(--font); background: var(--cream); color: var(--ink); }
    .demo { max-width: 560px; margin: 0 auto; padding: 3rem 1.25rem; color: var(--muted); line-height: 1.55; }
    .demo h1 { color: var(--ink); font-size: 1.5rem; margin: 0 0 .5rem; }
    .demo a { color: var(--orange); font-weight: 700; }
    .demo button {
      margin-top: 1rem; min-height: 2.75rem; padding: 0 1.2rem; border: none; border-radius: 12px;
      background: var(--orange); color: #fff; font: inherit; font-weight: 750; cursor: pointer;
    }

    .psf-pop {
      position: fixed; inset: 0; z-index: 99999;
      display: grid; place-items: end center; padding: 0;
      background: rgba(20,17,14,.48); backdrop-filter: blur(5px);
      opacity: 0; pointer-events: none; transition: opacity .35s ease;
    }
    .psf-pop.is-open { opacity: 1; pointer-events: auto; }
    .psf-pop__card {
      position: relative; width: min(720px, 100%);
      display: grid; grid-template-columns: 200px 1fr;
      border-radius: 24px 24px 0 0; background: #fff;
      box-shadow: 0 -20px 60px rgba(20,17,14,.22);
      transform: translateY(40px); transition: transform .45s cubic-bezier(.2,.8,.2,1);
      overflow: hidden;
    }
    .psf-pop.is-open .psf-pop__card { transform: translateY(0); }
    .psf-pop__close {
      position: absolute; top: .7rem; right: .7rem; z-index: 3;
      width: 2.15rem; height: 2.15rem; border-radius: 999px;
      border: 1.5px solid var(--line); background: #fff; cursor: pointer; font-size: 1.2rem;
    }
    .psf-pop__mascot {
      background:
        radial-gradient(ellipse 90% 70% at 50% 100%, rgba(255,136,6,.28), transparent 60%),
        linear-gradient(180deg, #fff8f0, #f0e8dc);
      display: grid; place-items: center; padding: .75rem;
    }
    .psf-pop__lottie { width: 170px; height: 170px; }
    .psf-pop__lottie lottie-player { width: 100%; height: 100%; }
    .psf-pop__copy { padding: 1.6rem 1.5rem 1.45rem 1.1rem; }
    .psf-pop__copy h2 {
      margin: 0; font-size: clamp(1.35rem, 3vw, 1.7rem); font-weight: 800;
      letter-spacing: -.03em; line-height: 1.15;
    }
    .psf-pop__copy h2 em { font-style: normal; color: var(--orange); }
    .psf-pop__copy p {
      margin: .55rem 0 0; color: var(--muted); font-size: .92rem; line-height: 1.5; font-weight: 500;
    }
    .psf-pop__actions { display: flex; flex-wrap: wrap; gap: .55rem; margin-top: 1.1rem; }
    .psf-pop__btn {
      display: inline-flex; align-items: center; justify-content: center;
      min-height: 2.85rem; padding: 0 1.1rem; border-radius: 12px;
      font-family: var(--font); font-size: .9rem; font-weight: 750; text-decoration: none !important;
      transition: transform .2s ease;
    }
    .psf-pop__btn:hover { transform: translateY(-2px); }
    .psf-pop__btn--primary {
      color: #fff !important;
      background: linear-gradient(135deg, #ff9f2e, var(--orange) 50%, var(--orange-deep));
      box-shadow: 0 10px 24px rgba(255,136,6,.28);
    }
    .psf-pop__btn--ghost {
      color: var(--ink) !important; border: 1.5px solid var(--line); background: #fff;
    }

    @media (max-width: 560px) {
      .psf-pop__card { grid-template-columns: 1fr; }
      .psf-pop__mascot { min-height: 160px; }
      .psf-pop__actions { flex-direction: column; }
      .psf-pop__btn { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="demo">
    <h1>Popup F — Lottie Wave Character</h1>
    <p>Friendly bottom-sheet with a waving Lottie character — warm and personal for “Book Arshad”.</p>
    <button type="button" id="psf-pop-reopen">Show popup again</button>
    <p style="margin-top:1rem">
      <a href="popup-e-lottie-success.html">← E</a> ·
      <a href="popup-g-lottie-package.html">G →</a>
    </p>
  </div>

  <div class="psf-pop" id="psf-pop" role="dialog" aria-modal="true" aria-labelledby="psf-pop-title">
    <div class="psf-pop__card">
      <button class="psf-pop__close" type="button" aria-label="Close" data-psf-pop-close>&times;</button>
      <div class="psf-pop__mascot" aria-hidden="true">
        <div class="psf-pop__lottie">
          <lottie-player
            src="./lottie/scan.json"
            background="transparent"
            speed="1"
            loop
            autoplay
          ></lottie-player>
        </div>
      </div>
      <div class="psf-pop__copy">
        <h2 id="psf-pop-title">Hey — want prep that <em>keeps up</em>?</h2>
        <p>Talk with Arshad about your channels, or grab a free quote in a few minutes.</p>
        <div class="psf-pop__actions">
          <a class="psf-pop__btn psf-pop__btn--primary" href="https://prepservicesfba.com/free-fulfillment-audit/">Get a Free Quote</a>
          <a class="psf-pop__btn psf-pop__btn--ghost" href="tel:+13476613010">Book a Call with Arshad</a>
        </div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      var KEY = "psfPopFDismissed";
      var pop = document.getElementById("psf-pop");
      function open() { pop.classList.add("is-open"); document.body.style.overflow = "hidden"; }
      function close() {
        pop.classList.remove("is-open"); document.body.style.overflow = "";
        try { sessionStorage.setItem(KEY, "1"); } catch (e) {}
      }
      pop.querySelectorAll("[data-psf-pop-close]").forEach(function (el) { el.addEventListener("click", close); });
      pop.addEventListener("click", function (e) { if (e.target === pop) close(); });
      document.addEventListener("keydown", function (e) { if (e.key === "Escape") close(); });
      document.getElementById("psf-pop-reopen").addEventListener("click", function () {
        try { sessionStorage.removeItem(KEY); } catch (e) {}
        open();
      });
      var dismissed = false;
      try { dismissed = sessionStorage.getItem(KEY) === "1"; } catch (e) {}
      if (!dismissed) setTimeout(open, 900);
    })();
  </script>
</body>
</html>
